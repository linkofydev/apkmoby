name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Uploads alone must not deploy — concurrent upload deploys race and can
      # overwrite a newer publish (article disappears from the live site).
      - 'public/uploads/**'
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://apkmoby.com
      - run: npx wrangler pages deploy dist --project-name apkmoby --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
