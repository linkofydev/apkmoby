backend:
  name: github
  repo: niamatali/custom-apk-site
  branch: main
  # For local publishing without GitHub OAuth, keep local_backend true
  # and run: npm run cms
local_backend: true
# Uncomment after GitHub OAuth is configured:
# publish_mode: editorial_workflow

site_url: https://apkmoby.com
display_url: https://apkmoby.com
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: apk
    label: APK Listings
    label_singular: APK Listing
    folder: src/content/apk
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string, hint: "On-page H1-adjacent title" }
      - { label: Meta Title, name: metaTitle, widget: string, hint: "SEO title, ~50-60 chars" }
      - { label: Meta Description, name: metaDescription, widget: text, hint: "~150-160 chars" }
      - { label: App Name, name: appName, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL path without slashes" }
      - { label: Icon, name: icon, widget: image, choose_url: true }
      - { label: Category, name: category, widget: select, options: ["Games", "Tools", "Lifestyle", "Photography", "Social", "Productivity", "Music", "Health"] }
      - { label: Version, name: version, widget: string }
      - { label: Size, name: size, widget: string, hint: "e.g. 84 MB" }
      - { label: Developer, name: developer, widget: string }
      - { label: Package Name, name: packageName, widget: string, hint: "e.g. com.studio.app" }
      - { label: Required Android, name: reqAndroid, widget: string, hint: "e.g. 8.0+" }
      - { label: Total Downloads, name: totalDownloads, widget: string }
      - { label: Rating Value, name: ratingValue, widget: number, value_type: float, min: 1, max: 5, step: 0.1 }
      - { label: Rating Count, name: ratingCount, widget: number, value_type: int, min: 0 }
      - { label: MOD Features, name: modFeatures, widget: list, field: { label: Feature, name: feature, widget: string } }
      - { label: Direct Download URL, name: downloadUrl, widget: string }
      - { label: Publish Date, name: publishDate, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Updated Date, name: updatedDate, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Featured Image, name: featuredImage, widget: image, choose_url: true }
      - { label: Screenshots, name: screenshots, widget: list, field: { label: Screenshot, name: screenshot, widget: image, choose_url: true } }
      - { label: Body, name: body, widget: markdown }
